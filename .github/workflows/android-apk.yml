name: Build UniTap Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build UniTap Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Show environment versions
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify UniTap Android identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = path => fs.readFileSync(path, 'utf8');
          const cap = read('capacitor.config.ts');
          const gradle = read('android/app/build.gradle');
          const strings = read('android/app/src/main/res/values/strings.xml');
          const activityPath = 'android/app/src/main/java/com/unitap/app/MainActivity.java';
          const checks = {
            'Capacitor appId': /appId:\s*['"]com\.unitap\.app['"]/.test(cap),
            'Android applicationId': /applicationId\s*(?:=|\s)\s*["']com\.unitap\.app["']/.test(gradle),
            'Android namespace': /namespace\s*(?:=|\s)\s*["']com\.unitap\.app["']/.test(gradle),
            'Android display name': /<string name="app_name">UniTap<\/string>/.test(strings),
            'UniTap MainActivity': fs.existsSync(activityPath)
              && /package\s+com\.unitap\.app;/.test(read(activityPath)),
          };
          for (const [name, pass] of Object.entries(checks)) {
            console.log(`${pass ? 'PASS' : 'FAIL'}: ${name}`);
          }
          if (Object.values(checks).some(pass => !pass)) {
            throw new Error('UniTap Android identity is incomplete. Build aborted to protect NFC Inspector.');
          }
          NODE

      - name: Build Ionic/Vue web assets
        run: pnpm run build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK package and NFC permission
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::APK not generated"; exit 1; }
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.unitap.app'" \
            || { echo "::error::Built APK package is NOT com.unitap.app"; exit 1; }
          "$AAPT" dump permissions "$APK" | grep -F "android.permission.NFC" \
            || { echo "::error::NFC permission missing in APK"; exit 1; }

      - name: Package downloadable UniTap APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/unitap-debug.apk
          {
            echo "App: UniTap"
            echo "Android applicationId: com.unitap.app"
            echo "Build type: Debug (installable)"
            echo "GitHub run: ${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Build date UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Node: $(node --version)"
            echo "pnpm: $(pnpm --version)"
            echo "Java: $(java -version 2>&1 | head -n 1)"
          } > artifacts/build-info.txt
          (cd artifacts && sha256sum unitap-debug.apk > SHA256SUMS.txt)
          ls -lh artifacts/

      - name: Upload UniTap Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: unitap-android-apk-build-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
